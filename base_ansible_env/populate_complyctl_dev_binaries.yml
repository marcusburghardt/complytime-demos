---
- name: "Prepare the complyctl environment on the Demo VM"
  hosts: demo_vm
  become: false
  vars:
    # Path to local clone of https://github.com/complytime/complyctl.git
    # Override with: ansible-playbook -e complyctl_repo_dest=~/path/to/complyctl
    complyctl_repo_dest: "~/GIT/ProdSec/complyctl"
    # Path to local clone of https://github.com/complytime/complytime-providers.git
    # Override with: ansible-playbook -e providers_repo_dest=~/path/to/providers
    providers_repo_dest: "~/GIT/ProdSec/complytime-providers"
    # XDG-compliant user data directory for provider discovery
    # complyctl searches this path with highest priority
    provider_dir: "~/.local/share/complytime/providers"
    # Pin third-party tool versions to avoid breakage from upstream Go version bumps
    # Keep in sync with populate_complyctl_dev_rpm.yml
    snappy_version: "v0.2.6"
    ampel_version: "v1.3.6"
    conftest_version: "0.69.0"

  tasks:
    - name: "Ensure removal of packages from previous installation"
      ansible.builtin.dnf:
        name:
          - complyctl
          - complytime-providers
          - complytime-providers-openscap
          - complytime-providers-ampel
          - complytime-providers-opa
        state: absent
      become: true

    - name: "Build complyctl locally"
      ansible.builtin.command:
        cmd: "make build"
        chdir: "{{ complyctl_repo_dest }}"
      delegate_to: localhost
      changed_when: true
      environment:
        GOTOOLCHAIN: auto

    - name: "Build complytime-providers locally"
      ansible.builtin.command:
        cmd: "make build"
        chdir: "{{ providers_repo_dest }}"
      delegate_to: localhost
      changed_when: true
      environment:
        GOTOOLCHAIN: auto

    - name: "Ensure bin directory in home directory to make it easier to call complyctl"
      ansible.builtin.file:
        path: "~/bin"
        state: directory
        mode: "0750"

    - name: "Copy complyctl binary to Demo VM"
      ansible.builtin.copy:
        src: "{{ complyctl_repo_dest }}/bin/complyctl"
        dest: "~/bin/complyctl"
        mode: "0750"

    - name: "Ensure providers directory exists"
      ansible.builtin.file:
        path: "{{ provider_dir }}"
        state: directory
        mode: "0750"

    - name: "Copy OpenSCAP provider binary to Demo VM"
      ansible.builtin.copy:
        src: "{{ providers_repo_dest }}/bin/complyctl-provider-openscap"
        dest: "{{ provider_dir }}/complyctl-provider-openscap"
        mode: "0750"

    - name: "Copy AMPEL provider binary to Demo VM"
      ansible.builtin.copy:
        src: "{{ providers_repo_dest }}/bin/complyctl-provider-ampel"
        dest: "{{ provider_dir }}/complyctl-provider-ampel"
        mode: "0750"

    - name: "Copy OPA provider binary to Demo VM"
      ansible.builtin.copy:
        src: "{{ providers_repo_dest }}/bin/complyctl-provider-opa"
        dest: "{{ provider_dir }}/complyctl-provider-opa"
        mode: "0750"

    - name: "Install snappy tool"
      ansible.builtin.command:
        cmd: "go install github.com/carabiner-dev/snappy@{{ snappy_version }}"
      environment:
        GOPATH: "{{ ansible_facts['env']['HOME'] }}/go"

    - name: "Install ampel tool"
      ansible.builtin.command:
        cmd: "go install github.com/carabiner-dev/ampel/cmd/ampel@{{ ampel_version }}"
      environment:
        GOPATH: "{{ ansible_facts['env']['HOME'] }}/go"

    - name: "Download conftest binary"
      ansible.builtin.get_url:
        url: "https://github.com/open-policy-agent/conftest/releases/download/v{{ conftest_version }}/conftest_{{ conftest_version }}_Linux_x86_64.tar.gz"
        dest: "/tmp/conftest_{{ conftest_version }}.tar.gz"
        mode: "0644"

    - name: "Install conftest binary"
      ansible.builtin.unarchive:
        src: "/tmp/conftest_{{ conftest_version }}.tar.gz"
        dest: "~/bin"
        remote_src: true
        include:
          - conftest
        mode: "0750"

    - name: "Ensure ~/go/bin is in PATH via .bashrc"
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
        line: 'export PATH="$HOME/go/bin:$PATH"'
        regexp: 'export PATH="\$HOME/go/bin'
        state: present
...
